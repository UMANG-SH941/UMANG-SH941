name: 3D Contribution City

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      # @latest — release tags are v-prefixed (v0.9.1), so a bare "0.7.1" does not resolve
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 100

      - name: Show what was produced
        run: ls -la profile-3d-contrib/

      # Commit straight to main — no extra branch, nothing to go stale
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: regenerate 3D contribution calendar [skip ci]"
          git push
