name: Arcade Contribution Graphs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # dist/ must be created by the runner user FIRST.
      # Platane/snk runs inside Docker as root; if it creates dist/ first,
      # the pacman action (running as the normal runner user) gets EACCES.
      - name: Prepare output dir
        run: |
          mkdir -p dist
          chmod 777 dist

      # ── ARCADE: pacman + galaga + breakout (runs as runner user) ──
      # Correct input is `games`, NOT `outputs`.
      # Produces dist/<game>-contribution-graph.svg and -dark.svg
      - name: Generate arcade graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,galaga,breakout'

      # ── SNAKE (runs as root in Docker — safe to go second) ──
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Fix permissions and list output
        run: |
          sudo chmod -R a+rw dist || chmod -R a+rw dist || true
          ls -la dist/

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
