name: Metrics Deep Scan

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      USER: ${{ github.repository_owner }}
      TOKEN: ${{ secrets.METRICS_TOKEN }}
      TZ: Asia/Kolkata
    steps:
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.isocalendar.svg
          token: ${{ env.TOKEN }}
          user: ${{ env.USER }}
          base: ""
          config_timezone: ${{ env.TZ }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.languages.svg
          token: ${{ env.TOKEN }}
          user: ${{ env.USER }}
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15

      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.habits.svg
          token: ${{ env.TOKEN }}
          user: ${{ env.USER }}
          base: ""
          config_timezone: ${{ env.TZ }}
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.achievements.svg
          token: ${{ env.TOKEN }}
          user: ${{ env.USER }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      - name: Stars
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.stars.svg
          token: ${{ env.TOKEN }}
          user: ${{ env.USER }}
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph
