<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="System diagnostics panel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff7"/>
      <stop offset="100%" stop-color="#ff2bd1"/>
    </linearGradient>
    <pattern id="g2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#7b5cff" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <filter id="gg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family:"SFMono-Regular","Consolas","Liberation Mono","Courier New",monospace; }
      .lbl { font-size:13.5px; fill:#9fb2e0; letter-spacing:1.1px; }
      .val { font-size:12.5px; fill:#39ff88; letter-spacing:1px; }
      .hd  { font-size:15px; fill:#00fff7; letter-spacing:3px; }
    </style>
  </defs>

  <rect width="1000" height="360" fill="#05070f"/>
  <rect width="1000" height="360" fill="url(#g2)"/>
  <rect x="1" y="1" width="998" height="358" fill="none" stroke="#7b5cff" stroke-width="1" opacity="0.45"/>

  <text class="m hd" x="28" y="40">▚ SYSTEM DIAGNOSTICS // CORE LOADOUT</text>
  <line x1="28" y1="54" x2="972" y2="54" stroke="#ff2bd1" opacity="0.4"/>

  <!-- BARS -->
  <g class="m">
    <!-- 1 -->
    <text class="lbl" x="20" y="92">PYTHON  //  PROFICIENT</text>
    <rect x="230" y="80" width="570" height="14" fill="#0d1226" stroke="#1d2a52"/>
    <rect x="230" y="80" height="14" fill="url(#bar)" filter="url(#gg)" width="0">
      <animate attributeName="width" values="0;520" dur="1.8s" fill="freeze"/>
    </rect>
    <text class="val" x="818" y="92">92%</text>

    <!-- 2 -->
    <text class="lbl" x="20" y="126">C  ·  C++  ·  SQL</text>
    <rect x="230" y="114" width="570" height="14" fill="#0d1226" stroke="#1d2a52"/>
    <rect x="230" y="114" height="14" fill="url(#bar)" filter="url(#gg)" width="0">
      <animate attributeName="width" values="0;440" dur="1.8s" begin="0.15s" fill="freeze"/>
    </rect>
    <text class="val" x="818" y="126">79%</text>

    <!-- 3 -->
    <text class="lbl" x="20" y="160">PYTORCH  ·  CNN/RNN/XFMR</text>
    <rect x="230" y="148" width="570" height="14" fill="#0d1226" stroke="#1d2a52"/>
    <rect x="230" y="148" height="14" fill="url(#bar)" filter="url(#gg)" width="0">
      <animate attributeName="width" values="0;500" dur="1.8s" begin="0.3s" fill="freeze"/>
    </rect>
    <text class="val" x="818" y="160">91%</text>

    <!-- 4 -->
    <text class="lbl" x="20" y="194">MLOPS  ·  AWS/DOCKER/K8S</text>
    <rect x="230" y="182" width="570" height="14" fill="#0d1226" stroke="#1d2a52"/>
    <rect x="230" y="182" height="14" fill="url(#bar)" filter="url(#gg)" width="0">
      <animate attributeName="width" values="0;400" dur="1.8s" begin="0.45s" fill="freeze"/>
    </rect>
    <text class="val" x="818" y="194">78%</text>

    <!-- 5 -->
    <text class="lbl" x="20" y="228">BAYESIAN  ·  SIGNAL PROC</text>
    <rect x="230" y="216" width="570" height="14" fill="#0d1226" stroke="#1d2a52"/>
    <rect x="230" y="216" height="14" fill="url(#bar)" filter="url(#gg)" width="0">
      <animate attributeName="width" values="0;480" dur="1.8s" begin="0.6s" fill="freeze"/>
    </rect>
    <text class="val" x="818" y="228">86%</text>

    <!-- 6 -->
    <text class="lbl" x="20" y="262">CAFFEINE BUFFER</text>
    <rect x="230" y="250" width="570" height="14" fill="#0d1226" stroke="#1d2a52"/>
    <rect x="230" y="250" height="14" fill="#39ff88" filter="url(#gg)" width="0">
      <animate attributeName="width" values="0;570;550;570" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text class="val" x="818" y="262">OVERFLOW</text>
  </g>

  <!-- readout ticker -->
  <g class="m">
    <line x1="28" y1="288" x2="972" y2="288" stroke="#1d2a52"/>
    <text x="28" y="312" font-size="12" fill="#6b7ba8">
      <tspan>[ok] cuda.init()</tspan>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="230" y="312" font-size="12" fill="#6b7ba8">
      <tspan>[ok] eeg.fourier_filter(--snr +10%)</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.4;.8;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="540" y="312" font-size="12" fill="#6b7ba8">
      <tspan>[ok] cnn.prune(1.2M → 156K)</tspan>
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.2;.4;.55;.85;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="760" y="312" font-size="12" fill="#39ff88">
      <tspan>[!] legacy.create() → RUNNING</tspan>
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;.2;.4;.6;.75;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- pulse waveform -->
  <path d="M28 340 L120 340 L136 322 L152 356 L168 340 L300 340 L316 326 L332 352 L348 340 L560 340 L576 318 L592 358 L608 340 L972 340"
        fill="none" stroke="#00fff7" stroke-width="1.6" opacity="0.85" filter="url(#gg)"
        stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" values="1400;0" dur="2.6s" repeatCount="indefinite"/>
  </path>
</svg>
