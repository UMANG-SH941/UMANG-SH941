<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 42" width="1000" height="42" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7b5cff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#7b5cff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#00fff7" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#ff2bd1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2bd1" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="0" y1="21" x2="1000" y2="21" stroke="url(#dl)" stroke-width="2" filter="url(#dg)"/>
  <line x1="0" y1="21" x2="1000" y2="21" stroke="#00fff7" stroke-width="1" opacity="0.35"
        stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-160" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- traveling packet -->
  <g filter="url(#dg)">
    <rect x="-60" y="17" width="60" height="8" rx="4" fill="#39ff88" opacity="0.95">
      <animate attributeName="x" values="-60;1000" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- nodes -->
  <g fill="#0b0f22" stroke="#00fff7" stroke-width="1.4">
    <circle cx="160" cy="21" r="4"><animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="21" r="5"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="21" r="4"><animate attributeName="r" values="3;6;3" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
