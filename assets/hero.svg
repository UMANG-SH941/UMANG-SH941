<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="UMANG SHUKLA - Deep Learning Researcher" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff7"/>
      <stop offset="45%" stop-color="#ff2bd1"/>
      <stop offset="100%" stop-color="#7b5cff"/>
      <animate attributeName="x1" values="-1;0.4;-1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.4;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="55%" stop-color="#080b1c"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#00fff7" stroke-width="0.5" opacity="0.13"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#00fff7" opacity="0.055"/>
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00fff7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00fff7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00fff7" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="typeclip">
      <rect x="120" y="196" width="0" height="30">
        <animate attributeName="width"
          values="0;0;70;140;210;280;350;420;470;520;560;560;560;0"
          keyTimes="0;0.04;0.10;0.16;0.22;0.28;0.34;0.40;0.46;0.52;0.58;0.90;0.96;1"
          dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <style>
      .mono { font-family: "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace; }
      .flick { animation: flick 5.5s infinite steps(1); }
      @keyframes flick {
        0%,96%,100% { opacity: 1 }
        96.5% { opacity: .25 }
        97%  { opacity: 1 }
        97.5%{ opacity: .55 }
        98%  { opacity: 1 }
      }
      .jitterA { animation: jitterA 4.2s infinite steps(1); }
      @keyframes jitterA {
        0%,90%,100% { transform: translate(0,0); opacity:.85 }
        91% { transform: translate(-3px,1px); opacity:.95 }
        93% { transform: translate(2px,-1px); opacity:.7 }
        95% { transform: translate(-2px,0); opacity:.95 }
      }
      .jitterB { animation: jitterB 4.2s infinite steps(1); }
      @keyframes jitterB {
        0%,90%,100% { transform: translate(0,0); opacity:.8 }
        91% { transform: translate(3px,-1px); opacity:.9 }
        93% { transform: translate(-2px,1px); opacity:.65 }
        95% { transform: translate(2px,0); opacity:.9 }
      }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    </style>
  </defs>

  <rect width="1000" height="300" fill="url(#vign)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- horizon lines -->
  <g stroke="#ff2bd1" opacity="0.18">
    <line x1="0" y1="262" x2="1000" y2="262" stroke-width="0.8"/>
    <line x1="0" y1="274" x2="1000" y2="274" stroke-width="0.8"/>
    <line x1="0" y1="290" x2="1000" y2="290" stroke-width="0.8"/>
  </g>

  <!-- drifting starfield (space nerd) -->
  <g fill="#dfe9ff">
    <circle cx="80"  cy="52"  r="1.2" opacity=".8"><animate attributeName="opacity" values=".2;.9;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="34"  r="1"   opacity=".6"><animate attributeName="opacity" values=".9;.2;.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="46"  r="1.3" opacity=".7"><animate attributeName="opacity" values=".2;1;.2"  dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="70"  r="1"   opacity=".5"><animate attributeName="opacity" values=".8;.1;.8" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="200" r="1.1" opacity=".6"><animate attributeName="opacity" values=".2;.8;.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="210" r="1"   opacity=".5"><animate attributeName="opacity" values=".9;.2;.9" dur="5.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- corner brackets -->
  <g stroke="url(#neon)" stroke-width="2.2" fill="none" filter="url(#softglow)">
    <path d="M24 60 L24 24 L96 24"/>
    <path d="M976 60 L976 24 L904 24"/>
    <path d="M24 240 L24 276 L96 276"/>
    <path d="M976 240 L976 276 L904 276"/>
  </g>

  <!-- status chip -->
  <g class="mono">
    <rect x="120" y="46" width="330" height="24" rx="3" fill="#00fff7" opacity="0.08"/>
    <rect x="120" y="46" width="2.5" height="24" fill="#00fff7"/>
    <circle cx="136" cy="58" r="3.6" fill="#39ff88">
      <animate attributeName="opacity" values="1;.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="148" y="63" font-size="12.5" fill="#8ef7ff" letter-spacing="1.6">SYS://ONLINE — GUNA, MP, IN — UTC+05:30</text>
  </g>

  <!-- glitch title -->
  <g class="mono" filter="url(#glow)">
    <text class="jitterA" x="120" y="150" font-size="72" font-weight="bold" fill="#ff2bd1" letter-spacing="4">UMANG SHUKLA</text>
    <text class="jitterB" x="120" y="150" font-size="72" font-weight="bold" fill="#00fff7" letter-spacing="4">UMANG SHUKLA</text>
    <text class="flick"   x="120" y="150" font-size="72" font-weight="bold" fill="#eaf6ff" letter-spacing="4">UMANG SHUKLA</text>
  </g>

  <!-- accent underline -->
  <rect x="120" y="166" width="560" height="3" fill="url(#neon)" filter="url(#softglow)">
    <animate attributeName="width" values="60;560;560;60" keyTimes="0;0.25;0.85;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- typing line -->
  <g clip-path="url(#typeclip)" class="mono">
    <text x="120" y="218" font-size="21" fill="#9ef7ff" letter-spacing="1.2">Deep Learning Researcher @ IIT Mandi</text>
  </g>
  <rect class="cur" y="198" width="11" height="24" fill="#39ff88">
    <animate attributeName="x"
      values="122;122;192;262;332;402;472;542;592;642;682;682;682;122"
      keyTimes="0;0.04;0.10;0.16;0.22;0.28;0.34;0.40;0.46;0.52;0.58;0.90;0.96;1"
      dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- code stamp -->
  <text class="mono" x="120" y="252" font-size="12.5" fill="#6b7ba8" letter-spacing="1.2">
    B.Tech CSE (AI &amp; ML) ’ 28  //  Affective Computing  ·  Computer Vision  ·  Space Weather
  </text>

  <!-- scanlines + sweep -->
  <rect width="1000" height="300" fill="url(#scan)" pointer-events="none"/>
  <rect x="0" y="-70" width="1000" height="70" fill="url(#sweep)" pointer-events="none">
    <animate attributeName="y" values="-70;300" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch tear bars -->
  <rect x="0" y="120" width="1000" height="7" fill="#00fff7" opacity="0">
    <animate attributeName="opacity" values="0;0;0.28;0;0" keyTimes="0;0.90;0.925;0.95;1" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="120;96;172;120" keyTimes="0;0.92;0.94;1" dur="4.2s" repeatCount="indefinite"/>
  </rect>
</svg>
